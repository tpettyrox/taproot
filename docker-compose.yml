version: "3.9"

services:
  # ── Graph database ─────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.15-community
    container_name: taproot-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/taprootpass
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Object storage ──────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-05T22-17-24Z
    container_name: taproot-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (taproot / taprootpass)
    environment:
      MINIO_ROOT_USER: taproot
      MINIO_ROOT_PASSWORD: taprootpass
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Face recognition (CompreFace) ───────────────────────────────────────────
  compreface-db:
    image: exadel/compreface-postgres-db:1.2.0
    container_name: taproot-compreface-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: frs
    volumes:
      - compreface_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  compreface-core:
    image: exadel/compreface-core:1.2.0
    container_name: taproot-compreface-core
    depends_on:
      compreface-db:
        condition: service_healthy
    environment:
      BE_VERSION: 1.2.0
      UWSGI_PROCESSES: 2
      UWSGI_THREADS: 1

  compreface-api:
    image: exadel/compreface-api:1.2.0
    container_name: taproot-compreface-api
    depends_on:
      compreface-db:
        condition: service_healthy
      compreface-core:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://compreface-db:5432/frs
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SAVE_IMAGES_TO_DB: "true"
      COMPREFACE_CORE_URL: http://compreface-core:3000

  compreface-fe:
    image: exadel/compreface-fe:1.2.0
    container_name: taproot-compreface-fe
    ports:
      - "8000:80"   # UI at http://localhost:8000
    depends_on:
      - compreface-api
    environment:
      CLIENT_MAX_BODY_SIZE: 10m
      PROXY_READ_TIMEOUT: 60000ms
      COMPREFACE_API_URL: http://compreface-api:8080

volumes:
  neo4j_data:
  neo4j_logs:
  minio_data:
  compreface_db:
